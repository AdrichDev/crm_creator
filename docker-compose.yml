name: 3a_estudio

services:
  # NOTA: el Postgres local `db-crm` (pgvector, :5434) se RETIRÓ en la migración a
  # Supabase. Tenancy ahora es row-level en el schema `crm` de Supabase; el back usa
  # DATABASE_URL al pooler de Supabase. No hay schema-per-tenant ni pool docker.

  # Automatizaciones (perfil opcional). Variables en back/.env (único .env del back),
  # leídas con --env-file: solo se interpolan las que este archivo referencia.
  # Arrancar: cd back && npm run n8n:up
  #   (o desde la raíz: docker compose --env-file back/.env --profile n8n up -d)
  # n8n consume los eventos de dominio que emite el back (best-effort). El CRM
  # NUNCA depende de que este servicio esté arriba.
  n8n:
    # Keep in sync with the agents-agency n8n version.
    image: n8nio/n8n:3.2.2
    container_name: crm-n8n
    profiles: ["n8n"]
    restart: unless-stopped
    # Host port 5679: agents-agency runs its own n8n on 5678, so both can run at once.
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5679/
      - GENERIC_TIMEZONE=Europe/Madrid
      # Necesario para que el nodo Code del dispatcher pueda usar require('crypto')
      # y verificar la firma HMAC del webhook.
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # n8n >=1.x bloquea $env en nodos por defecto; el Code lee AUTOMATION_WEBHOOK_SECRET.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Clave de cifrado de credenciales de n8n: OBLIGATORIA (sin valor por defecto conocido).
      # Si ya arrancaste n8n con el antiguo default, define en tu .env ese mismo valor o n8n
      # no podrá descifrar las credenciales guardadas en el volumen.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY en back/.env}
      # MISMO secreto que el back (AUTOMATION_WEBHOOK_SECRET). El dispatcher lo lee
      # via $env para recomputar el HMAC y rechazar firmas invalidas.
      - AUTOMATION_WEBHOOK_SECRET=${AUTOMATION_WEBHOOK_SECRET:?Define AUTOMATION_WEBHOOK_SECRET en back/.env}
    volumes:
      - crm_n8n_data:/home/node/.n8n

volumes:
  crm_n8n_data:
